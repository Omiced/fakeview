<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeStore API Viewer</title>
    <style>
        :root {
            /* Paleta de colores Dark Theme */
            --bg-main: #0f172a;
            /* Slate 900 */
            --bg-card: #1e293b;
            /* Slate 800 */
            --bg-code: #020617;
            /* Slate 950 */
            --text-main: #cbd5e1;
            /* Slate 300 */
            --text-light: #f8fafc;
            /* Slate 50 */
            --text-muted: #94a3b8;
            /* Slate 400 */

            /* Acentos */
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;

            /* Sintaxis JSON */
            --syntax-key: #38bdf8;
            /* Light Blue */
            --syntax-string: #34d399;
            /* Emerald 400 */
            --syntax-number: #f472b6;
            /* Pink 400 */
            --syntax-boolean: #fbbf24;
            /* Amber 400 */
            --syntax-null: #f87171;
            /* Red 400 */

            --border-color: #334155;
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            color: var(--text-light);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        h1 span {
            color: var(--accent-cyan);
        }

        button {
            background: transparent;
            color: var(--accent-emerald);
            border: 2px solid var(--accent-emerald);
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
        }

        button:hover {
            background: var(--accent-emerald);
            color: var(--bg-main);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Layout Layout */
        .dashboard {
            max-width: 800px;
            /* Ancho máximo reducido */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
        }

        .top-section {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 2rem;
        }

        section {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            /* Evitar desbordes (overflow-x) a nivel de sección */
        }

        .section-title {
            color: var(--accent-cyan);
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            font-family: monospace;
        }

        .empty-state,
        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 200px;
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- Sección 1: JSON --- */
        pre {
            background-color: var(--bg-code);
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            flex-grow: 1;
            margin: 0;
            border: 1px solid #1e293b;
            max-width: 100%;
        }

        .key {
            color: var(--syntax-key);
        }

        .string {
            color: var(--syntax-string);
        }

        .number {
            color: var(--syntax-number);
        }

        .boolean {
            color: var(--syntax-boolean);
        }

        .null {
            color: var(--syntax-null);
        }

        /* --- Sección 2: Card UI --- */
        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .product-card {
            background-color: var(--bg-code);
            border-radius: var(--radius);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .product-image-container {
            background-color: #ffffff;
            /* Fondo blanco para las imágenes PNG */
            height: 250px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-badge {
            display: inline-block;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-emerald);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            border: 1px solid var(--accent-emerald);
        }

        .product-title {
            color: var(--text-light);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-price {
            color: var(--accent-cyan);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stars {
            color: #fbbf24;
            letter-spacing: 2px;
        }

        /* --- Sección 3: Tabla DB --- */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: var(--bg-code);
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(30, 41, 59, 0.5);
            color: var(--accent-cyan);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        td {
            color: var(--text-main);
        }

        .col-id {
            color: var(--syntax-number);
            font-weight: bold;
        }

        .col-string {
            color: var(--syntax-string);
        }

        .col-num {
            color: var(--syntax-number);
        }

        .truncate {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
        }
    </style>
</head>

<body>

    <header>
        <h1>FakeStore <span>Explorer</span></h1>
        <button id="fetch-btn" onclick="fetchProduct()">Obtener Producto Aleatorio</button>
    </header>

    <div class="dashboard">
        <div class="top-section">
            <!-- Sección 1: Raw JSON -->
            <section>
                <h2 class="section-title">Lo que recibe el programador</h2>
                <div id="json-container" class="empty-state">
                    Haz clic en el botón para cargar datos
                </div>
            </section>

            <!-- Sección 2: UI Card -->
            <section>
                <h2 class="section-title">Lo que ve el usuario</h2>
                <div id="card-container" class="empty-state">
                    Esperando datos del producto...
                </div>
            </section>
        </div>

        <!-- Sección 3: Database Table -->
        <section>
            <h2 class="section-title">Registro en la base de datos</h2>
            <div id="table-container" class="empty-state">
                No hay registros en la vista actual
            </div>
        </section>
    </div>

    <script>
        // Referencias a los contenedores
        const btn = document.getElementById('fetch-btn');
        const jsonContainer = document.getElementById('json-container');
        const cardContainer = document.getElementById('card-container');
        const tableContainer = document.getElementById('table-container');

        // Función para colorear el JSON
        function syntaxHighlight(jsonObj) {
            let json = JSON.stringify(jsonObj, null, 2);
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'key';
                    } else {
                        cls = 'string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        // Función principal
        async function fetchProduct() {
            // Generar ID aleatorio 1-20
            const randomId = Math.floor(Math.random() * 20) + 1;

            // Estado de carga
            btn.disabled = true;
            btn.textContent = 'Cargando...';
            const loadingHtml = '<div class="loading-state">Obteniendo datos...</div>';
            jsonContainer.innerHTML = loadingHtml;
            cardContainer.innerHTML = loadingHtml;
            tableContainer.innerHTML = loadingHtml;

            try {
                const response = await fetch(`https://fakestoreapi.com/products/${randomId}`);
                if (!response.ok) throw new Error('Error en la red');
                const product = await response.json();

                renderJSON(product);
                renderCard(product);
                renderTable(product);
            } catch (error) {
                const errorHtml = `<div class="empty-state" style="color: #f87171;">Error al cargar: ${error.message}</div>`;
                jsonContainer.innerHTML = errorHtml;
                cardContainer.innerHTML = errorHtml;
                tableContainer.innerHTML = errorHtml;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Obtener Producto Aleatorio';
            }
        }

        // Renderizar JSON
        function renderJSON(product) {
            const formattedJson = syntaxHighlight(product);
            jsonContainer.innerHTML = `<pre><code>${formattedJson}</code></pre>`;
        }

        // Renderizar Card
        function renderCard(product) {
            // Calcular estrellas (redondear para simplificar)
            const rate = Math.round(product.rating.rate);
            const emptyStars = 5 - rate;
            const starsHtml = '★'.repeat(rate) + '☆'.repeat(emptyStars);

            const cardHtml = `
                <div class="card-container">
                    <div class="product-card">
                        <div class="product-image-container">
                            <img src="${product.image}" alt="${product.title}">
                        </div>
                        <div class="product-info">
                            <span class="product-badge">${product.category}</span>
                            <h3 class="product-title" title="${product.title}">${product.title}</h3>
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                            <div class="product-rating">
                                <span class="stars">${starsHtml}</span>
                                <span>${product.rating.rate} (${product.rating.count} reviews)</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            cardContainer.innerHTML = cardHtml;
        }

        // Renderizar Tabla
        function renderTable(product) {
            const tableHtml = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>id (PK)</th>
                                <th>title (VARCHAR)</th>
                                <th>price (DECIMAL)</th>
                                <th>category (VARCHAR)</th>
                                <th>description (TEXT)</th>
                                <th>image_url (VARCHAR)</th>
                                <th>rating_rate (DEC)</th>
                                <th>rating_count (INT)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="col-id">${product.id}</td>
                                <td>${product.title}</td>
                                <td class="col-num">$${product.price}</td>
                                <td class="col-string">'${product.category}'</td>
                                <td><span class="truncate" title="${product.description}">${product.description}</span></td>
                                <td><span class="truncate col-string" title="${product.image}">'${product.image}'</span></td>
                                <td class="col-num">${product.rating.rate}</td>
                                <td class="col-num">${product.rating.count}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
            tableContainer.innerHTML = tableHtml;
        }
    </script>
</body>

</html>
